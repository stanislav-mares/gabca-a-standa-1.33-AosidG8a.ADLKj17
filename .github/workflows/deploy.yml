name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro vpéká PUBLIC_* proměnné do bundlu při buildu, takže hodnota musí
      # být v prostředí právě tady — .env je v .gitignore a na runneru není.
      # Bez toho se dotazník odešle do prázdna (viz Questionnaire.astro).
      - name: Build
        run: npm run build
        env:
          PUBLIC_QUESTIONNAIRE_ENDPOINT: ${{ secrets.PUBLIC_QUESTIONNAIRE_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
